<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg:     #0D0D0D;
    --bg2:    #141414;
    --bg3:    #1A1A1A;
    --bg4:    #222222;

    --border:  rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);

    --text:  #F2F2F2;
    --text2: #A0A0A0;
    --text3: #666666;

    --accent:  #6C63FF;
    --accent2: #8B83FF;
    --accent3: rgba(108,99,255,0.15);
    --blue:    #4A9EFF;

    --glass:  rgba(255,255,255,0.04);
    --glass2: rgba(255,255,255,0.07);

    --r:  20px;
    --r2: 14px;
    --r3: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---------- Ambient gradient blobs ---------- */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    animation: blob-in 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, blob-float 12s ease-in-out infinite;
  }

  .blob-1 {
    width: 480px; height: 480px;
    top: -140px; left: -120px;
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
    animation-delay: 0s, 2.4s;
  }

  .blob-2 {
    width: 420px; height: 420px;
    bottom: -160px; right: -100px;
    background: radial-gradient(circle at 60% 40%, var(--blue), transparent 70%);
    animation-delay: 0.2s, 2.6s;
  }

  .blob-3 {
    width: 340px; height: 340px;
    bottom: 10%; left: 8%;
    background: radial-gradient(circle at 50% 50%, var(--accent2), transparent 70%);
    opacity: 0;
    animation: blob-in-soft 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards, blob-float 14s ease-in-out infinite reverse;
    animation-delay: 0.4s, 3s;
  }

  @keyframes blob-in {
    to { opacity: 0.35; }
  }
  @keyframes blob-in-soft {
    to { opacity: 0.18; }
  }
  @keyframes blob-float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -20px); }
  }

  /* ---------- Grain / vignette for depth ---------- */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    width: 380px;
    padding: 40px 36px 32px;
    border-radius: var(--r);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid var(--border2);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08);

    opacity: 0;
    transform: translateY(24px) scale(0.96);
    filter: blur(6px);
    animation: card-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.5s;
  }

  @keyframes card-in {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--r3);
    background: linear-gradient(135deg, var(--accent), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 24px rgba(108,99,255,0.35);
  }

  .card-icon svg { width: 22px; height: 22px; }

  .card-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  .card-sub {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 28px;
  }

  /* ---------- Form ---------- */
  .field {
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .field:nth-of-type(1) { animation-delay: 0.85s; }
  .field:nth-of-type(2) { animation-delay: 0.95s; }

  @keyframes field-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .field label {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--r3);
    background: var(--bg4);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }

  .field input::placeholder { color: var(--text3); }

  .field input:focus {
    border-color: var(--accent);
    background: var(--bg3);
    box-shadow: 0 0 0 3px var(--accent3);
  }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 12px;
    opacity: 0;
    animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 1.05s;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text2);
  }

  .remember input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
  }

  .forgot {
    color: var(--accent2);
    text-decoration: none;
  }
  .forgot:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: var(--r3);
    background: linear-gradient(135deg, var(--accent), var(--blue));
    color: #fff;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(108,99,255,0.35);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;

    opacity: 0;
    transform: translateY(10px);
    animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 1.15s;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 28px rgba(108,99,255,0.45);
    filter: brightness(1.05);
  }
  .btn:active { transform: translateY(0); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--text3);
    font-size: 11px;
    opacity: 0;
    animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 1.25s;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .socials {
    display: flex;
    gap: 10px;
    opacity: 0;
    animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 1.35s;
  }

  .social-btn {
    flex: 1;
    padding: 10px;
    border-radius: var(--r3);
    background: var(--glass);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .social-btn:hover {
    background: var(--glass2);
    border-color: var(--border2);
  }
  .social-btn svg { width: 16px; height: 16px; }

  .footer-text {
    text-align: center;
    margin-top: 24px;
    font-size: 12.5px;
    color: var(--text2);
    opacity: 0;
    animation: field-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 1.45s;
  }
  .footer-text a {
    color: var(--accent2);
    text-decoration: none;
    font-weight: 500;
  }
  .footer-text a:hover { text-decoration: underline; }

</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="vignette"></div>

  <div class="card">
    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to continue to your account</div>

    <form onsubmit="return false;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <div class="socials">
      <div class="social-btn" aria-label="Sign in with Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      </div>
      <div class="social-btn" aria-label="Sign in with GitHub">
        <svg viewBox="0 0 24 24" fill="#F2F2F2"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A10.51 10.51 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5z"/></svg>
      </div>
    </div>

    <div class="footer-text">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

</body>
</html>
